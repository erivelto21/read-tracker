apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: {{ .Values.namespace }}
  labels:
    app: mongo
    {{- include "tracker.labels" . | nindent 4 }}
spec:
  {{- if .Values.mongodb.external.enabled }}
  type: ExternalName
  externalName: {{ .Values.mongodb.external.host }}
  ports:
    - port: 27017
      targetPort: 27017
  {{- else }}
  clusterIP: None
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
  {{- end }}

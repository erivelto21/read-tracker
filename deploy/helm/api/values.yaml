namespace: read-tracker

image:
  repository: container-registry.br-se1.magalu.cloud/my-register/read-tracker
  tag: latest
  # pullPolicy: IfNotPresent

api:
  replicas: 2
  port: 8080

mongodb:
  # if true, provisions an in-cluster MongoDB (StatefulSet + Service).
  # if false, nothing is created — the api connects via secrets.mongodbUri
  # (e.g. to an external VM-hosted MongoDB).
  enabled: false
  image: mongo:6.0
  storage: 10Gi

# Secret values — leave empty here; provide via values.secret.yaml (SOPS-encrypted, gitignored)
secrets:
  mongodbUri: ""
  dbName: "read_tracker"
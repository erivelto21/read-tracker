apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/rate_limit.conf
          subPath: rate_limit.conf
        - name: nginx-htpasswd
          mountPath: /etc/nginx/auth
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
          items:
          - key: default.conf
            path: default.conf
          - key: rate_limit.conf
            path: rate_limit.conf
      - name: nginx-htpasswd
        secret:
          secretName: nginx-htpasswd

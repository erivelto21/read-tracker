apiVersion: apps/v1
kind: Deployment
metadata:
  name: read-tracker
  labels:
    app: read-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: read-tracker
  template:
    metadata:
      labels:
        app: read-tracker
    spec:
      imagePullSecrets:
      - name: magalu-registry-secret
      containers:
      - name: read-tracker
        image: container-registry.br-se1.magalu.cloud/my-register/read-tracker:latest
        # imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: read-tracker-config
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: read-tracker-secrets
              key: mongodb_uri
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: read-tracker-secrets
              key: db_name

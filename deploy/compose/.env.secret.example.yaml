# Example shape of the SOPS-encrypted secret file.
#
# The real file is deploy/compose/.env.secret.yaml, encrypted with SOPS and age
# under the rule in the repository root .sops.yaml:
#
#   sops deploy/compose/.env.secret.yaml
#
# It is consumed by scripts/app-vm-deploy.sh, which merges these values into the
# VM's .env and derives the Basic Auth file and the MongoDB init script.
# This example file is a reference only — never put real values in it.

# ── MongoDB ───────────────────────────────────────────────────────────────────
# Password for the application user "readtracker" (readWrite on read_tracker).
MONGO_PASSWORD: ""
# Password for the MongoDB root user.
MONGO_ROOT_PASSWORD: ""

# ── Container registry ────────────────────────────────────────────────────────
REGISTRY_USER: ""
REGISTRY_PASSWORD: ""

# ── HTTP Basic Auth ───────────────────────────────────────────────────────────
# Plain credentials for nginx. scripts/app-vm-deploy.sh derives the .htpasswd
# hash itself, so no pre-hashed value is stored here.
#
# The hash is generated in Apache apr1 format, not bcrypt: nginx:1.27-alpine
# runs on musl, whose crypt(3) cannot verify bcrypt hashes.
NGINX_USER: ""
NGINX_PASSWORD: ""
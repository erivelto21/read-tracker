# Flattened equivalent of the `rate_limit.conf` key rendered by
# deploy/helm/front/templates/nginx-configmap.yaml, with the Helm values inlined
# (zone=front, rate=10r/s).
#
# Mounted at /etc/nginx/conf.d/rate_limit.conf, which nginx includes inside the
# `http` block — the only context where limit_req_zone is valid.

limit_req_zone $binary_remote_addr zone=front:10m rate=10r/s;
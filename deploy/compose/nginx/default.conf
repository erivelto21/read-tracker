# Flattened equivalent of the `default.conf` key rendered by
# deploy/helm/front/templates/nginx-configmap.yaml, with every .Values.* reference
# inlined. This is a new file — the Helm chart template is untouched.
#
# Behaviour preserved from the cluster deployment:
#   /       → static React app with SPA fallback
#   /api/   → proxied to the Go API with the prefix stripped, rate limited
#   server  → HTTP Basic Auth covering both locations

server {
  listen 80;

  auth_basic "Restricted";
  auth_basic_user_file /etc/nginx/auth/.htpasswd;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    limit_req zone=front burst=20 nodelay;

    # `api` is the Compose service name; the trailing slash strips the /api/ prefix.
    proxy_pass http://api:8080/;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}